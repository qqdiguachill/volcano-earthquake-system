name: Update volcano earthquake data

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawlers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python jma_eqvol_neon.py
          python jma_earthquake_neon.py
          python tenki_ash_neon.py
